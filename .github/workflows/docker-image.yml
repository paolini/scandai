name: Docker Image CI

on:
 workflow_dispatch:
 push:
   branches:
     - main
     - develop

jobs:
  build:
    # MongoDB 8 cannot start on the Linux 6.19 kernel used by Ubuntu 26.04.
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: install node packages
      run: npm ci --legacy-peer-deps
    - name: Check production dependencies
      run: npm audit --omit=dev
    - name: Generate GraphQL types
      run: npm run codegen && git diff --exit-code -- generated/graphql.ts
    - name: Test
      env:
        SCANDAI_TEST_MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}/scandai_dependency_test
      run: npm test
    - name: Install test browser
      run: npx playwright install --with-deps chromium
    - name: Test student questionnaire in browser
      env:
        SCANDAI_E2E_MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}/scandai_questionnaire_test
      run: npm run test:e2e
    - name: Extract version number
      run: echo VERSION=$( node -e 'console.log(require("./package.json").version)' ) >> $GITHUB_ENV
    - name: Test version number and branch name
      run: echo version ${{ env.VERSION }} ref_name ${{ github.ref_name }} 
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: paolini/scandai
        tags: |
          type=ref,event=tag
          type=ref,event=branch
          type=semver,pattern={{version}}
    - name: Login to docker hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v7
      if: ${{ github.event_name != 'pull_request' }}
      with:
        push: true
        context: .
        tags: paolini/scandai:latest , paolini/scandai:${{ github.ref_name }} , paolini/scandai:${{ github.ref_name }}_${{ env.VERSION }} 
#        tags: ${{ steps.meta.outputs.tags }}
#        labels: ${{ steps.meta.outputs.labels }}
    - name: Notify WUD of published image
      if: ${{ steps.docker_build.outcome == 'success' }}
      env:
        WUD_WEBHOOK_TOKEN: ${{ secrets.WUD_WEBHOOK_TOKEN }}
        IMAGE_TAG: ${{ github.ref_name }}
        IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
      run: |
        set -euo pipefail
        if [ -z "$WUD_WEBHOOK_TOKEN" ]; then
          echo "::error::Configure the WUD_WEBHOOK_TOKEN repository secret before deploying."
          exit 1
        fi
        node <<'NODE' > "$RUNNER_TEMP/wud-event.json"
        const { IMAGE_TAG, IMAGE_DIGEST } = process.env;
        if (!['main', 'develop'].includes(IMAGE_TAG) || !/^sha256:[a-f0-9]{64}$/.test(IMAGE_DIGEST || '')) {
          throw new Error('Invalid published image tag or digest');
        }
        process.stdout.write(JSON.stringify({
          events: [{
            action: 'push',
            target: {
              mediaType: 'application/vnd.docker.distribution.manifest.v2+json',
              repository: 'paolini/scandai',
              tag: IMAGE_TAG,
              digest: IMAGE_DIGEST,
              url: `https://registry-1.docker.io/v2/paolini/scandai/manifests/${IMAGE_TAG}`,
            },
          }],
        }));
        NODE
        curl --fail-with-body --silent --show-error \
          --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
          --header "Authorization: Bearer $WUD_WEBHOOK_TOKEN" \
          --header 'Content-Type: application/json' \
          --data-binary "@$RUNNER_TEMP/wud-event.json" \
          'https://wud5.matb.it/api/registries/hub.public/events'
        echo "WUD notified for paolini/scandai:$IMAGE_TAG. Update processing is asynchronous." >> "$GITHUB_STEP_SUMMARY"
